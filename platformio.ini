[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	paulstoffregen/Encoder@^1.4.4
	robtillaart/ACS712@^0.3.10
	luni64/EncoderTool@^3.2.2
	asukiaaa/MPU9250_asukiaaa@^1.5.13
    adafruit/Adafruit BNO055@^1.3.3
    adafruit/Adafruit Unified Sensor@^1.1.15
	